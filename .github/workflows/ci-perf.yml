# Tier 4 CI: Release Performance, Scale Gates & Benchmark Smoke
#
# Disabled on pull_request events to conserve GitHub Actions minutes.
# Run manually from Actions → "CI — Release Perf & Benchmarks" → Run workflow,
# or locally via `./scripts/preflight-pr.sh --perf`.
name: CI — Release Perf & Benchmarks

on:
  workflow_dispatch:
    inputs:
      features:
        description: Optional Cargo features (e.g. proc-macros)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ci-perf-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  RGCTL_AST_COVERAGE_STRICT: "1"
  FEATURES: ${{ inputs.features || '' }}

jobs:
  perf:
    name: Release CLI golden paths, scale/perf gates & bench smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          shared-key: ci-perf-${{ env.FEATURES }}

      - name: Run Tier 4 preflight (release CLI goldens, scale/perf gates & bench check)
        run: ./scripts/preflight-pr.sh --perf --features "${{ env.FEATURES }}"
