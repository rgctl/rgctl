# Build release binaries for Linux, macOS (Apple Silicon + Intel), and Windows,
# then publish a GitHub Release with downloadable archives.
#
# Triggers:
#   - push to main    — when Cargo.toml version vX.Y.Z has no tag yet, creates tag vX.Y.Z and builds/publishes
#   - push tag v*     — direct tag push (e.g. git tag v0.1.0 && git push origin v0.1.0)
#   - workflow_dispatch — rebuild and (re)publish for an existing tag or draft from a ref
name: Release

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0). Used for asset names; defaults to the pushed tag or Cargo.toml version.
        required: false
        type: string
      ref:
        description: Git ref to build when not triggered by a tag push
        required: false
        default: main
        type: string
      draft:
        description: Publish as draft release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Check release tag
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      checkout_ref: ${{ steps.check.outputs.checkout_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref || (inputs.tag != '' && inputs.tag || inputs.ref) }}

      - name: Resolve version and tag if needed
        id: check
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VERSION="$(python3 -c 'import re,pathlib; print(re.search(r"(?ms)^\[workspace\.package\].*?^version = \"([^\"]+)\"", pathlib.Path("Cargo.toml").read_text()).group(1))')"

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAG="v${CARGO_VERSION}"
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "Tag ${TAG} already exists; skipping release build on main push."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
              echo "version=${CARGO_VERSION}" >> "$GITHUB_OUTPUT"
              echo "checkout_ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "New workspace version ${CARGO_VERSION} detected on main; creating and pushing tag ${TAG}."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${CARGO_VERSION}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Avoid duplicate run if this tag was just created by the main-branch push job above.
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "Release ${TAG} already exists; skipping."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # workflow_dispatch
          RAW_TAG="${{ inputs.tag }}"
          if [[ -z "${RAW_TAG}" ]]; then
            VERSION="${CARGO_VERSION}"
            TAG="v${VERSION}"
          else
            VERSION="${RAW_TAG#v}"
            TAG="v${VERSION}"
          fi
          REF="${{ inputs.tag != '' && inputs.tag || inputs.ref }}"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=${REF}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin: rgctl
            # Default features include semantic-onnx (code-daemon embedder).
            cargo_args: --features semantic-onnx
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            bin: rgctl
            cargo_args: --features semantic-onnx
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            bin: rgctl
            # ort 2.x has no prebuilt ONNX Runtime for Intel Mac; hash embedder only.
            cargo_args: --no-default-features
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin: rgctl.exe
            cargo_args: --features semantic-onnx

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release ${{ matrix.cargo_args }} --target ${{ matrix.target }} --bin rgctl

      - name: Package archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          STAGING="package"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGING/rgctl"
          chmod +x "$STAGING/rgctl"
          ARCHIVE="rgctl-${VERSION}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$STAGING" rgctl
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "package/rgctl.exe"
          $archive = "rgctl-${version}-${{ matrix.target }}.zip"
          Compress-Archive -Path package/rgctl.exe -DestinationPath $archive -Force
          echo "ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download all platform archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # Artifacts may land flat (merge-multiple) or under per-target dirs.
          mapfile -t archives < <(
            find . -type f \( -name 'rgctl-*.tar.gz' -o -name 'rgctl-*.zip' \) | sort
          )
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "error: no rgctl archives under dist/; refusing empty SHA256SUMS.txt" >&2
            find . -type f | head -50 >&2
            exit 1
          fi
          # Flatten into dist/ so softprops uploads a single flat file set.
          for f in "${archives[@]}"; do
            base="$(basename "$f")"
            if [[ "$f" != "./$base" ]]; then
              mv -f "$f" "./$base"
            fi
          done
          : > SHA256SUMS.txt
          for f in rgctl-*.tar.gz rgctl-*.zip; do
            [[ -f "$f" ]] || continue
            shasum -a 256 "$f" >> SHA256SUMS.txt
          done
          if [[ ! -s SHA256SUMS.txt ]]; then
            echo "error: SHA256SUMS.txt is empty" >&2
            exit 1
          fi
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt
          echo "lines=$(wc -l < SHA256SUMS.txt)"

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          NOTES="docs/releases/${TAG}.md"
          if [[ -f "$NOTES" ]]; then
            cp "$NOTES" release-body.md
            echo "Using curated notes from ${NOTES}"
          else
            : > release-body.md
            echo "No docs/releases/${TAG}.md; GitHub will generate notes only"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: rgctl ${{ steps.meta.outputs.tag }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ contains(steps.meta.outputs.tag, '-') }}
          body_path: release-body.md
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # secrets.* cannot appear in job/step `if:` — check token inside the step instead.
      - name: Trigger rgctl-tests report
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.draft }}
        env:
          DISPATCH_TOKEN: ${{ secrets.RGCTL_TESTS_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${DISPATCH_TOKEN}" ]]; then
            echo "RGCTL_TESTS_DISPATCH_TOKEN not set; skipping rgctl-tests report dispatch"
            exit 0
          fi
          payload="$(jq -nc \
            --arg tag "$RELEASE_TAG" \
            --arg repo "${{ github.repository }}" \
            --arg sha "${{ github.sha }}" \
            '{event_type:"rgctl-released", client_payload:{tag:$tag, rgctl_repo:$repo, rgctl_sha:$sha}}')"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            "https://api.github.com/repos/sshaaf/rgctl-tests/dispatches" \
            -d "$payload"
          echo "Dispatched rgctl-released for ${RELEASE_TAG}"
