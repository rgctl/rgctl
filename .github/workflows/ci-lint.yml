# Tier 1 CI: Format, Clippy, and Commit Policy
#
# Triggers:
#   - workflow_dispatch  — run manually from the Actions tab (any branch/ref).
#   - pull_request       — DCO sign-off and AI-trailer checks run on every PR;
#                          cargo fmt & clippy runs when a maintainer adds `ci` or `ci:lint`.
name: CI — Format & Clippy

on:
  workflow_dispatch:
    inputs:
      features:
        description: Optional Cargo features (e.g. proc-macros)
        required: false
        default: ""
        type: string
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-lint-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Fail the build on grammar ↔ *-ast-coverage.json drift (rgctl-languages build.rs).
  RGCTL_AST_COVERAGE_STRICT: "1"
  FEATURES: ${{ github.event_name == 'workflow_dispatch' && inputs.features || '' }}

jobs:
  awaiting-ci-label:
    name: awaiting maintainer `ci` or `ci:lint` label
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'ci') &&
      !contains(github.event.pull_request.labels.*.name, 'ci:lint')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Lint CI is gated until a maintainer opts in
        run: |
          cat <<'EOF'
          Format & Clippy CI is gated behind maintainer labels:
            - Add `ci:lint` to run only Format & Clippy
            - Add `ci` to run Format & Clippy + Unit & Core Integration Tests
          EOF

  commit-policy:
    name: DCO sign-off & no AI commit trailers
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR commits for DCO sign-off and no AI trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/check-no-ai-commit-trailers.py \
            --require-dco \
            --range "${BASE_SHA}..${HEAD_SHA}"

  fmt-and-clippy:
    name: cargo fmt & clippy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       (contains(github.event.pull_request.labels.*.name, 'ci') ||
        contains(github.event.pull_request.labels.*.name, 'ci:lint')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          shared-key: ci-lint-${{ env.FEATURES }}

      - name: Run Tier 1 preflight (fmt + clippy + check --tests)
        run: ./scripts/preflight-pr.sh --lint --features "${{ env.FEATURES }}"
