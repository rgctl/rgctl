# Tier 3 CI: QE, Cross-Language Correctness & AST Coverage
#
# Disabled on pull_request events to conserve GitHub Actions minutes.
# Run manually from Actions → "CI — QE & AST Coverage" → Run workflow,
# or locally via `./scripts/preflight-pr.sh --qe`.
name: CI — QE & AST Coverage

on:
  workflow_dispatch:
    inputs:
      features:
        description: Optional Cargo features (e.g. proc-macros)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ci-qe-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RGCTL_AST_COVERAGE_STRICT: "1"
  FEATURES: ${{ inputs.features || '' }}

jobs:
  qe:
    name: QE, E2E & AST coverage gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          shared-key: ci-test-${{ env.FEATURES }}

      - name: Run Tier 3 preflight (QE, E2E & AST coverage gates)
        run: ./scripts/preflight-pr.sh --qe --features "${{ env.FEATURES }}"
