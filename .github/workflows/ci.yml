# Triggers:
#   - workflow_dispatch  — full suite manually from the Actions tab (any branch/ref).
#   - pull_request       — always runs a cheap `cargo check` (default features).
#                         Full format/lint/test suite only when a maintainer adds the
#                         `ci` label (create that label in the repo if missing).
#
# Fork PRs: label must be added by a maintainer on the base-repo PR.
name: CI

on:
  workflow_dispatch:
    inputs:
      features:
        description: Optional Cargo features (e.g. proc-macros)
        required: false
        default: ""
        type: string
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FEATURES: ${{ github.event_name == 'workflow_dispatch' && inputs.features || '' }}

jobs:
  # Always-on cold-compile gate so ignored/missing Cargo.lock + pre-release crates
  # cannot break `cargo build` unnoticed (#123).
  check:
    name: cargo check (default features)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          shared-key: check-default

      - name: cargo check --bin rgctl
        run: cargo check --locked --bin rgctl

  ci:
    name: Format, lint, and test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ env.FEATURES }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --features "${{ env.FEATURES }}" --lib --bins -- -D warnings

      - name: cargo clippy (rgctl-analysis)
        run: cargo clippy -p rgctl-analysis --features "${{ env.FEATURES }}" -- -D warnings

      - name: cargo clippy (rgctl-graph, rgctl-core)
        run: cargo clippy -p rgctl-graph -p rgctl-core --features "${{ env.FEATURES }}" -- -D warnings

      - name: cargo test (unit and integration)
        run: cargo test --features "${{ env.FEATURES }}" --workspace --lib --bins --tests

      - name: QE map collisions
        run: cargo test --features "${{ env.FEATURES }}" --test map_collision_qe

      - name: QE graph correctness
        run: cargo test --features "${{ env.FEATURES }}" --test graph_correctness

      - name: QE semantic search
        run: cargo test --features "${{ env.FEATURES }}" --test semantic_search_qe

      - name: QE cross-feature consistency
        run: cargo test --features "${{ env.FEATURES }}" --test cross_feature_qe

      - name: CLI JSON contract (unit)
        run: cargo test --features "${{ env.FEATURES }}" --test cli_output

      - name: CLI subprocess golden paths
        run: cargo test --release --features "${{ env.FEATURES }}" --test subprocess_golden_path

      - name: CLI all-commands sanity
        run: cargo test --release --features "${{ env.FEATURES }}" --test all_commands_sanity

      - name: Blast-radius performance gates (release)
        run: cargo test --release --features "${{ env.FEATURES }}" --test blast_radius_perf