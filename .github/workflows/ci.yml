# Tier 2 CI: Unit & Core Integration Tests
#
# Note: Heavy QE/AST-coverage (`ci-qe.yml`) and Release Perf/Bench (`ci-perf.yml`)
# suites are split into separate manual workflows and disabled on PRs to save CI minutes.
# Format & Clippy runs in its own lightweight workflow (`ci-lint.yml`).
#
# Triggers:
#   - workflow_dispatch  — run manually from the Actions tab (any branch/ref).
#   - pull_request       — runs when a maintainer adds the `ci` or `ci:test` label.
name: CI

on:
  workflow_dispatch:
    inputs:
      features:
        description: Optional Cargo features (e.g. proc-macros)
        required: false
        default: ""
        type: string
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Fail the build on grammar ↔ *-ast-coverage.json drift (rgctl-languages build.rs).
  RGCTL_AST_COVERAGE_STRICT: "1"
  FEATURES: ${{ github.event_name == 'workflow_dispatch' && inputs.features || '' }}

jobs:
  awaiting-ci-label:
    name: awaiting maintainer `ci` label
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'ci') &&
      !contains(github.event.pull_request.labels.*.name, 'ci:test')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: CI is gated until a maintainer opts in
        run: |
          cat <<'EOF'
          CI does not run automatically on every PR.

          Maintainer labels:
            - `ci:lint` — run only Format & Clippy (.github/workflows/ci-lint.yml)
            - `ci:test` — run only Unit & Core Integration Tests (.github/workflows/ci.yml)
            - `ci`      — run Format & Clippy + Unit & Core Integration Tests

          Heavy QE (.github/workflows/ci-qe.yml) and Release Perf (.github/workflows/ci-perf.yml)
          are disabled on PRs and can be triggered on-demand via Actions → Run workflow.
          EOF

  test:
    name: Unit and core integration tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       (contains(github.event.pull_request.labels.*.name, 'ci') ||
        contains(github.event.pull_request.labels.*.name, 'ci:test')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ env.FEATURES }}

      - name: cargo test (workspace unit & bin tests)
        run: cargo test --features "${{ env.FEATURES }}" --workspace --lib --bins --no-fail-fast

      - name: CLI JSON contract (unit)
        run: cargo test --features "${{ env.FEATURES }}" --test cli_output

      - name: Single-Pass Complexity Parity
        run: cargo test --features "${{ env.FEATURES }}" -p rgctl-extraction --test single_pass_complexity_parity

      - name: CFG/PDG v3 TOC, Lazy Slicing & Shadowing Correctness
        run: cargo test --features "${{ env.FEATURES }}" --test slicing --test taint_analysis

      - name: Fast-Leiden Connectivity & Centrality NodeRole Audit
        run: cargo test --features "${{ env.FEATURES }}" --test community_audit --test centrality_audit

      - name: Incremental FactsCache & Updater Equivalence
        run: cargo test --features "${{ env.FEATURES }}" --test incremental_performance_integration
