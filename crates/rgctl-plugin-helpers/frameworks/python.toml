language = "python"

[[rules]]
id = "fastapi.flask.route_decorator"
framework = "fastapi"
kind = "RouteDecorator"
class_prefix_annotations = ["APIRouter", "Blueprint"]
method_annotations = [
  { name = "get", method = "GET" },
  { name = "post", method = "POST" },
  { name = "put", method = "PUT" },
  { name = "delete", method = "DELETE" },
  { name = "patch", method = "PATCH" },
  { name = "options", method = "OPTIONS" },
  { name = "head", method = "HEAD" },
  { name = "api_route", method_arg = "methods", default_method = "GET" },
  { name = "route", method_arg = "methods", default_method = "GET" },
]
tags = ["role:endpoint", "protocol:http"]
vocab = "endpoint endpoints route routes http rest api handler fastapi flask"

[[rules]]
id = "django.flask.route_call"
framework = "django"
kind = "RouteCall"
router_callees = [
  { name = "path", method = "ANY" },
  { name = "re_path", method = "ANY" },
  { name = "url", method = "ANY" },
  { name = "add_url_rule", method_arg = "methods", default_method = "GET" },
]
tags = ["role:endpoint", "protocol:http"]
vocab = "endpoint endpoints route routes http django flask urlpattern"

[[rules]]
id = "fastapi.depends_di"
framework = "fastapi"
kind = "ParamCallInject"
provider_calls = ["Depends", "Security"]
tags = ["role:di-consumer"]
vocab = "dependency injection provider inject depends security fastapi"
target_vocab = "dependency injection provider service injectable"

[[rules]]
id = "python.reflection"
framework = "python"
kind = "ConceptTagger"
call_callees = ["getattr", "setattr", "delattr", "import_module", "__subclasses__"]
tags = ["role:reflection"]
vocab = "reflection reflect dynamic introspection getattr import_module"

# --- Bidirectional writeback profiles ---

[[frameworks]]
id = "fastapi"
import_prefixes = ["fastapi."]
worklist_supertype_triggers = []
worklist_call_triggers = []


[frameworks.writeback.field_inject]
template = "Depends({name})"
imports = ["fastapi"]

[frameworks.writeback.class_route_prefix]
template = "APIRouter(prefix=\"{path}\")"
imports = ["fastapi"]

[frameworks.writeback.method_route.GET]
template = "@router.get(\"{path}\")"
imports = ["fastapi"]

[frameworks.writeback.method_route.POST]
template = "@router.post(\"{path}\")"
imports = ["fastapi"]

[frameworks.writeback.method_route.PUT]
template = "@router.put(\"{path}\")"
imports = ["fastapi"]

[frameworks.writeback.method_route.DELETE]
template = "@router.delete(\"{path}\")"
imports = ["fastapi"]

[frameworks.writeback.method_route.PATCH]
template = "@router.patch(\"{path}\")"
imports = ["fastapi"]

[frameworks.writeback.param_bind.query]
template = "{name}: Annotated[str, Query()]"
imports = ["fastapi", "typing"]

[frameworks.writeback.param_bind.path]
template = "{name}: Annotated[str, Path()]"
imports = ["fastapi", "typing"]

[[frameworks]]
id = "flask"
import_prefixes = ["flask."]
worklist_supertype_triggers = ["Blueprint"]
worklist_call_triggers = []

[frameworks.writeback.class_route_prefix]
template = "Blueprint(\"{name}\", __name__, url_prefix=\"{path}\")"
imports = ["flask"]

[frameworks.writeback.method_route.GET]
template = "@app.route(\"{path}\", methods=[\"GET\"])"
imports = ["flask"]

[frameworks.writeback.method_route.POST]
template = "@app.route(\"{path}\", methods=[\"POST\"])"
imports = ["flask"]

[frameworks.writeback.method_route.PUT]
template = "@app.route(\"{path}\", methods=[\"PUT\"])"
imports = ["flask"]

[frameworks.writeback.method_route.DELETE]
template = "@app.route(\"{path}\", methods=[\"DELETE\"])"
imports = ["flask"]

[frameworks.writeback.method_route.PATCH]
template = "@app.route(\"{path}\", methods=[\"PATCH\"])"
imports = ["flask"]

[[frameworks]]
id = "django"
import_prefixes = ["django."]
worklist_supertype_triggers = ["View", "APIView"]
worklist_call_triggers = []

[frameworks.writeback.method_route.GET]
template = "path(\"{path}\", {name})"
imports = ["django.urls"]

[frameworks.writeback.method_route.POST]
template = "path(\"{path}\", {name})"
imports = ["django.urls"]

[frameworks.writeback.method_route.PUT]
template = "path(\"{path}\", {name})"
imports = ["django.urls"]

[frameworks.writeback.method_route.DELETE]
template = "path(\"{path}\", {name})"
imports = ["django.urls"]
