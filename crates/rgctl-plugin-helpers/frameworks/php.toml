language = "php"

[[rules]]
id = "laravel.symfony.route_call"
framework = "laravel"
kind = "RouteCall"
router_callees = [
  { name = "get", method = "GET" },
  { name = "post", method = "POST" },
  { name = "put", method = "PUT" },
  { name = "delete", method = "DELETE" },
  { name = "patch", method = "PATCH" },
]
tags = ["role:endpoint", "protocol:http"]
vocab = "endpoint endpoints route routes http laravel symfony"

[[rules]]
id = "laravel.symfony.route_decorator"
framework = "symfony"
kind = "RouteDecorator"
method_annotations = [
  { name = "Route", method_arg = "methods", default_method = "GET" },
]
tags = ["role:endpoint", "protocol:http"]
vocab = "endpoint endpoints route routes http laravel symfony attribute"

[[rules]]
id = "php.ctor_di"
framework = "php"
kind = "CtorOrStereotypeInject"
annotations = ["Inject", "Autowired", "Required"]
tags = ["role:di-consumer"]
vocab = "dependency injection constructor inject php"
target_vocab = "dependency injection provider service injectable"

[[rules]]
id = "php.reflection"
framework = "php"
kind = "ConceptTagger"
call_callees = ["ReflectionClass", "ReflectionMethod"]
tags = ["role:reflection"]
vocab = "reflection reflect ReflectionClass ReflectionMethod php"

# --- Bidirectional writeback profiles ---

[[frameworks]]
id = "laravel"
import_prefixes = ["Illuminate\\", "Laravel\\"]
worklist_supertype_triggers = ["Controller"]
worklist_call_triggers = []


[frameworks.writeback.method_route.GET]
template = "Route::get('{path}', [{name}::class, 'handle']);"
imports = ["Illuminate\\Support\\Facades\\Route"]

[frameworks.writeback.method_route.POST]
template = "Route::post('{path}', [{name}::class, 'handle']);"
imports = ["Illuminate\\Support\\Facades\\Route"]

[frameworks.writeback.method_route.PUT]
template = "Route::put('{path}', [{name}::class, 'handle']);"
imports = ["Illuminate\\Support\\Facades\\Route"]

[frameworks.writeback.method_route.DELETE]
template = "Route::delete('{path}', [{name}::class, 'handle']);"
imports = ["Illuminate\\Support\\Facades\\Route"]

[frameworks.writeback.method_route.PATCH]
template = "Route::patch('{path}', [{name}::class, 'handle']);"
imports = ["Illuminate\\Support\\Facades\\Route"]

[[frameworks]]
id = "symfony"
import_prefixes = ["Symfony\\"]
worklist_supertype_triggers = ["AbstractController"]
worklist_call_triggers = []

[frameworks.writeback.controller_stereotype]
template = "#[AsController]"
imports = ["Symfony\\Component\\HttpKernel\\Attribute\\AsController"]

[frameworks.writeback.method_route.GET]
template = "#[Route('{path}', methods: ['GET'])]"
imports = ["Symfony\\Component\\Routing\\Annotation\\Route"]

[frameworks.writeback.method_route.POST]
template = "#[Route('{path}', methods: ['POST'])]"
imports = ["Symfony\\Component\\Routing\\Annotation\\Route"]

[frameworks.writeback.method_route.PUT]
template = "#[Route('{path}', methods: ['PUT'])]"
imports = ["Symfony\\Component\\Routing\\Annotation\\Route"]

[frameworks.writeback.method_route.DELETE]
template = "#[Route('{path}', methods: ['DELETE'])]"
imports = ["Symfony\\Component\\Routing\\Annotation\\Route"]

[frameworks.writeback.method_route.PATCH]
template = "#[Route('{path}', methods: ['PATCH'])]"
imports = ["Symfony\\Component\\Routing\\Annotation\\Route"]
