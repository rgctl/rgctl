language = "typescript"

[[rules]]
id = "nestjs.controller.stereotype"
framework = "nestjs"
kind = "ConceptTagger"
annotations = ["Controller"]
tags = ["role:controller"]
vocab = "controller controllers rest api endpoint endpoints web handler resource"

[[rules]]
id = "nestjs.http.routes"
framework = "nestjs"
kind = "RouteDecorator"
class_prefix_annotations = ["Controller"]
method_annotations = [
  { name = "Get", method = "GET" },
  { name = "Post", method = "POST" },
  { name = "Put", method = "PUT" },
  { name = "Delete", method = "DELETE" },
  { name = "Patch", method = "PATCH" },
  { name = "Options", method = "OPTIONS" },
  { name = "Head", method = "HEAD" },
  { name = "All", method = "ANY" },
]
tags = ["role:endpoint", "protocol:http"]
vocab = "endpoint endpoints route routes http rest api handler nestjs"

[[rules]]
id = "express.fastify.hono.route_call"
framework = "express"
kind = "RouteCall"
router_callees = [
  { name = "get", method = "GET" },
  { name = "post", method = "POST" },
  { name = "put", method = "PUT" },
  { name = "delete", method = "DELETE" },
  { name = "patch", method = "PATCH" },
  { name = "all", method = "ANY" },
]
tags = ["role:endpoint", "protocol:http"]
vocab = "endpoint endpoints route routes http express fastify hono"

[[rules]]
id = "nestjs.angular.ctor_di"
framework = "nestjs"
kind = "CtorOrStereotypeInject"
annotations = ["Injectable", "Controller", "Component", "Inject"]
tags = ["role:di-consumer"]
vocab = "dependency injection inject injectable provider service nestjs angular"
target_vocab = "dependency injection provider service injectable bean"

[[rules]]
id = "js.ts.reflection"
framework = "typescript"
kind = "ConceptTagger"
call_callees = ["getMetadata", "defineMetadata", "construct", "ownKeys"]
tags = ["role:reflection"]
vocab = "reflection reflect metadata introspection reflect-metadata"

# --- Bidirectional writeback profiles ---

[[frameworks]]
id = "nestjs"
import_prefixes = ["@nestjs/"]
worklist_supertype_triggers = []
worklist_call_triggers = []

[frameworks.writeback.controller_stereotype]
template = "@Controller()"
imports = ["@nestjs/common"]

[frameworks.writeback.service_stereotype]
template = "@Injectable()"
imports = ["@nestjs/common"]

[frameworks.writeback.field_inject]
template = "@Inject('{name}')"
imports = ["@nestjs/common"]

[frameworks.writeback.class_route_prefix]
template = "@Controller('{path}')"
imports = ["@nestjs/common"]

[frameworks.writeback.method_route.GET]
template = "@Get('{path}')"
imports = ["@nestjs/common"]

[frameworks.writeback.method_route.POST]
template = "@Post('{path}')"
imports = ["@nestjs/common"]

[frameworks.writeback.method_route.PUT]
template = "@Put('{path}')"
imports = ["@nestjs/common"]

[frameworks.writeback.method_route.DELETE]
template = "@Delete('{path}')"
imports = ["@nestjs/common"]

[frameworks.writeback.method_route.PATCH]
template = "@Patch('{path}')"
imports = ["@nestjs/common"]

[frameworks.writeback.param_bind.path]
template = "@Param('{name}')"
imports = ["@nestjs/common"]

[frameworks.writeback.param_bind.query]
template = "@Query('{name}')"
imports = ["@nestjs/common"]

[frameworks.writeback.param_bind.body]
template = "@Body()"
imports = ["@nestjs/common"]

[[frameworks]]
id = "express"
import_prefixes = ["express"]
worklist_supertype_triggers = ["Router"]
worklist_call_triggers = []

[frameworks.writeback.method_route.GET]
template = "app.get('{path}', {name})"
imports = ["express"]

[frameworks.writeback.method_route.POST]
template = "app.post('{path}', {name})"
imports = ["express"]

[frameworks.writeback.method_route.PUT]
template = "app.put('{path}', {name})"
imports = ["express"]

[frameworks.writeback.method_route.DELETE]
template = "app.delete('{path}', {name})"
imports = ["express"]

[frameworks.writeback.method_route.PATCH]
template = "app.patch('{path}', {name})"
imports = ["express"]

