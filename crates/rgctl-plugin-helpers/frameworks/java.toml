language = "java"

[[rules]]
id = "spring.controller.stereotype"
framework = "spring"
kind = "ConceptTagger"
annotations = ["RestController", "Controller", "GrpcService"]
tags = ["role:controller"]
vocab = "controller controllers rest api endpoint endpoints spring grpc"

[[rules]]
id = "spring.service.stereotype"
framework = "spring"
kind = "ConceptTagger"
annotations = ["Service", "Component", "Repository", "Configuration"]
tags = ["role:service"]
vocab = "service services component repository bean spring"

[[rules]]
id = "spring.jaxrs.http.routes"
framework = "spring"
kind = "RouteDecorator"
class_prefix_annotations = ["RequestMapping", "Path"]
method_annotations = [
  { name = "GetMapping", method = "GET" },
  { name = "PostMapping", method = "POST" },
  { name = "PutMapping", method = "PUT" },
  { name = "DeleteMapping", method = "DELETE" },
  { name = "PatchMapping", method = "PATCH" },
  { name = "RequestMapping", method_arg = "method", default_method = "GET" },
  { name = "GET", method = "GET" },
  { name = "POST", method = "POST" },
  { name = "PUT", method = "PUT" },
  { name = "DELETE", method = "DELETE" },
  { name = "PATCH", method = "PATCH" },
]
tags = ["role:endpoint", "protocol:http"]
vocab = "endpoint endpoints route routes http rest api handler spring jaxrs"

[[rules]]
id = "spring.jakarta.field_di"
framework = "spring"
kind = "FieldAnnotationInject"
annotations = ["Autowired", "Inject", "Resource", "Value", "ConfigProperty"]
tags = ["role:di-consumer"]
vocab = "dependency injection inject autowired bean field spring jakarta quarkus config"
target_vocab = "dependency injection provider service injectable bean"

[[rules]]
id = "spring.jakarta.ctor_di"
framework = "spring"
kind = "CtorOrStereotypeInject"
annotations = ["Autowired", "Inject", "RestController", "Controller", "Service", "Component", "Repository", "Configuration"]
tags = ["role:di-consumer"]
vocab = "dependency injection inject constructor bean spring jakarta"
target_vocab = "dependency injection provider service injectable bean"

[[rules]]
id = "jvm.reflection"
framework = "jvm-reflect"
kind = "ConceptTagger"
annotations = ["ReflectiveAccess", "RegisterForReflection"]
call_callees = ["forName", "getDeclaredMethod", "getDeclaredField", "getMethod", "getField", "newInstance", "invoke"]
tags = ["role:reflection"]
vocab = "reflection reflect dynamic class introspection invoke jvm"

[[rules]]
id = "jakarta.ee.di"
framework = "jakarta-ee"
kind = "FieldAnnotationInject"
annotations = ["Inject", "EJB", "Resource", "PersistenceContext", "ConfigProperty"]
tags = ["role:di-consumer"]
vocab = "dependency injection inject ejb resource persistence jakarta ee cdi quarkus config"
target_vocab = "dependency injection provider service injectable bean"

[[rules]]
id = "jakarta.ee.routes"
framework = "jakarta-ee"
kind = "RouteDecorator"
class_prefix_annotations = ["Path", "WebServlet", "MessageDriven"]
method_annotations = [
  { name = "GET", method = "GET" },
  { name = "POST", method = "POST" },
  { name = "PUT", method = "PUT" },
  { name = "DELETE", method = "DELETE" },
  { name = "PATCH", method = "PATCH" },
  { name = "Path", method = "GET" },
]
tags = ["role:endpoint", "protocol:http"]
vocab = "endpoint endpoints route routes http rest servlet jaxrs jakarta ee mdb"

[[rules]]
id = "spring.messaging.entrypoints"
framework = "spring"
kind = "ConceptTagger"
annotations = ["KafkaListener", "JmsListener", "RabbitListener", "Scheduled"]
tags = ["role:entrypoint", "protocol:messaging"]
vocab = "kafka jms rabbitmq listener scheduled messaging spring entrypoint consumer"

[[rules]]
id = "openliberty.microprofile.di"
framework = "openliberty"
kind = "FieldAnnotationInject"
annotations = ["Inject", "EJB", "Resource", "PersistenceContext", "ConfigProperty", "RestClient"]
tags = ["role:di-consumer"]
vocab = "dependency injection inject ejb resource persistence openliberty websphere microprofile cdi config restclient"
target_vocab = "dependency injection provider service injectable bean"

[[rules]]
id = "openliberty.jaxrs.routes"
framework = "openliberty"
kind = "RouteDecorator"
class_prefix_annotations = ["Path", "WebServlet", "MessageDriven"]
method_annotations = [
  { name = "GET", method = "GET" },
  { name = "POST", method = "POST" },
  { name = "PUT", method = "PUT" },
  { name = "DELETE", method = "DELETE" },
  { name = "PATCH", method = "PATCH" },
  { name = "Path", method = "GET" },
]
tags = ["role:endpoint", "protocol:http"]
vocab = "endpoint endpoints route routes http rest servlet jaxrs openliberty websphere microprofile mdb"

[[rules]]
id = "openliberty.messaging.entrypoints"
framework = "openliberty"
kind = "ConceptTagger"
annotations = ["Incoming", "Outgoing", "Asynchronous", "Schedule", "Schedules", "Timeout"]
tags = ["role:entrypoint", "protocol:messaging"]
vocab = "reactive messaging incoming outgoing async schedule timer openliberty microprofile"

# --- Bidirectional writeback profiles ---

[[frameworks]]
id = "spring"
import_prefixes = [
  "org.springframework.",
  "org.springframework.boot.",
]
namespace_rewrites = { "javax." = "jakarta." }
worklist_supertype_triggers = [
  "JpaRepository",
  "CrudRepository",
  "PagingAndSortingRepository",
  "SecurityFilterChain",
  "WebSecurityConfigurerAdapter",
]
worklist_call_triggers = [
  "getAuthentication",
  "SecurityContextHolder",
]

[frameworks.writeback.controller_stereotype]
template = "@RestController"
imports = ["org.springframework.web.bind.annotation.RestController"]

[frameworks.writeback.service_stereotype]
template = "@Service"
imports = ["org.springframework.stereotype.Service"]

[frameworks.writeback.repository_stereotype]
template = "@Repository"
imports = ["org.springframework.stereotype.Repository"]

[frameworks.writeback.field_inject]
template = "@Autowired"
imports = ["org.springframework.beans.factory.annotation.Autowired"]

[frameworks.writeback.config_inject]
template = "@Value(\"${{key}{default_kv}}\")"
imports = ["org.springframework.beans.factory.annotation.Value"]

[frameworks.writeback.transactional]
template = "@Transactional"
imports = ["org.springframework.transaction.annotation.Transactional"]

[frameworks.writeback.class_route_prefix]
template = "@RequestMapping(\"{path}\")"
imports = ["org.springframework.web.bind.annotation.RequestMapping"]

[frameworks.writeback.method_route.GET]
template = "@GetMapping(\"{path}\")"
imports = ["org.springframework.web.bind.annotation.GetMapping"]

[frameworks.writeback.method_route.POST]
template = "@PostMapping(\"{path}\")"
imports = ["org.springframework.web.bind.annotation.PostMapping"]

[frameworks.writeback.method_route.PUT]
template = "@PutMapping(\"{path}\")"
imports = ["org.springframework.web.bind.annotation.PutMapping"]

[frameworks.writeback.method_route.DELETE]
template = "@DeleteMapping(\"{path}\")"
imports = ["org.springframework.web.bind.annotation.DeleteMapping"]

[frameworks.writeback.method_route.PATCH]
template = "@PatchMapping(\"{path}\")"
imports = ["org.springframework.web.bind.annotation.PatchMapping"]

[frameworks.writeback.param_bind.path]
template = "@PathVariable(\"{name}\")"
imports = ["org.springframework.web.bind.annotation.PathVariable"]

[frameworks.writeback.param_bind.query]
template = "@RequestParam(\"{name}\")"
imports = ["org.springframework.web.bind.annotation.RequestParam"]

[frameworks.writeback.param_bind.header]
template = "@RequestHeader(\"{name}\")"
imports = ["org.springframework.web.bind.annotation.RequestHeader"]

[frameworks.writeback.param_bind.body]
template = "@RequestBody"
imports = ["org.springframework.web.bind.annotation.RequestBody"]

