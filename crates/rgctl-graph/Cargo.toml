[package]
name = "rgctl-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Graph storage and query layer for rgctl"
license = "MIT OR Apache-2.0"

[dependencies]
rgctl-error = { path = "../rgctl-error" }
rgctl-plugin-api = { path = "../rgctl-plugin-api" }
rgctl-plugin-helpers = { path = "../rgctl-plugin-helpers" }
bincode = "1.3"
blake3 = "1"
memmap2 = "0.9"
zstd = { workspace = true }
petgraph = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
rayon = "1.10"
tree-sitter = "0.25"
tree-sitter-java = "0.23"

[dev-dependencies]
tempfile = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "columnar_snapshot"
harness = false

[[bench]]
name = "snapshot_diff"
harness = false

[lints.clippy]
collapsible_if = "allow"
