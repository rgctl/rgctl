[package]
name = "rgctl-ast-coverage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "AST coverage manifest checks vs pinned tree-sitter grammars"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
tree-sitter-jinja = { workspace = true }
tree-sitter-yaml = "0.7"
rgctl-plugin-api = { path = "../rgctl-plugin-api" }
serde_json = "1"
tree-sitter = { workspace = true }
tree-sitter-java = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23.4"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-php = "0.24.2"
tree-sitter-ruby = "0.23.1"
tree-sitter-puppet = "1.3.0"
tree-sitter-embedded-template = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-groovy = "0.1.2"
tree-sitter-swift = "0.7.4"
tree-sitter-scala = "0.26.3"
tree-sitter-dart = "0.2.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-lua = "0.5.0"
tree-sitter-bash = "0.25.1"
tree-sitter-sql = { package = "tree-sitter-sequel", version = "0.3.11" }
tree-sitter-hcl = "1.1.0"
tree-sitter-md = { version = "0.5.3", default-features = false }

[lints]
workspace = true
