[package]
name = "rgctl-lang-sql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "rgctl language plugin: sql"
license = "MIT OR Apache-2.0"

[dependencies]
rgctl-plugin-api = { workspace = true }
rgctl-registry = { workspace = true }
rgctl-plugin-helpers = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-sql = { package = "tree-sitter-sequel", version = "0.3.11" }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
rgctl-ast-coverage = { workspace = true }

[lints.clippy]
collapsible_if = "allow"
