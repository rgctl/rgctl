[package]
name = "rgctl-plugin-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Stable plugin API for rgctl language and config format plugins"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["alloc", "derive", "rc"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
serde_yaml = "0.9"
smallvec = { version = "1", features = ["serde", "const_generics", "const_new", "union"] }
thiserror = "1"
toml = "0.8"
tree-sitter = "0.25"
tracing = { version = "0.1", features = ["log"] }

[dev-dependencies]
tree-sitter-rust = "0.24"

[lints.clippy]
collapsible_if = "allow"
