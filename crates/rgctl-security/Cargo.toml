[package]
name = "rgctl-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Security analysis for rgctl"
license = "MIT OR Apache-2.0"

[dependencies]
rgctl-analysis = { path = "../rgctl-analysis" }
rgctl-error = { path = "../rgctl-error" }
rgctl-extraction = { path = "../rgctl-extraction" }
rgctl-graph = { path = "../rgctl-graph" }
rgctl-plugin-api = { path = "../rgctl-plugin-api" }
bincode = "1.3"
osv = { workspace = true }
openvex = { workspace = true }
rayon = { workspace = true }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = { workspace = true }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
axum = "0.8"
tempfile = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[lints.clippy]
collapsible_if = "allow"
